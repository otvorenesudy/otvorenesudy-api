# Two databases: this app's own, for the records as the sources publish them, and Open Courts', which otvorenesudy
# owns and shares (its schema is db/opencourts_structure.sql here). The logins come from ENV, which dotenv loads from
# .env, and in the specs from .env.test first. Git ignores both: bin/setup makes them from the committed .env.example
# and .env.test.example, CI copies .env.ci to .env.test, and the server has its own .env, which Capistrano links into
# each release.
opencourts: &opencourts
  adapter: postgresql
  encoding: utf8
  pool: 300
  host: <%= ENV.fetch('OPENCOURTS_DATABASE_HOST', 'localhost') %>
  username: <%= ENV['OPENCOURTS_DATABASE_USER'] %>
  password: <%= ENV['OPENCOURTS_DATABASE_PASSWORD'] %>
  migrations_paths: db/opencourts_migrate

defaults: &defaults
  adapter: postgresql
  encoding: utf8
  pool: 300
  host: <%= ENV.fetch('OPENCOURTS_API_DATABASE_HOST', 'localhost') %>
  username: <%= ENV['OPENCOURTS_API_DATABASE_USER'] %>
  password: <%= ENV['OPENCOURTS_API_DATABASE_PASSWORD'] %>

development:
  primary:
    <<: *defaults
    database: opencourts_api_development

  opencourts:
    <<: *opencourts
    database: opencourts_development

test:
  primary:
    <<: *defaults
    database: opencourts_api_test

  opencourts:
    <<: *opencourts
    database: opencourts_test

production:
  primary:
    <<: *defaults
    database: opencourts_api_production

  opencourts:
    <<: *opencourts
    database: opencourts_production
