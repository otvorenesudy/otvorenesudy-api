# Weekly pull requests for newer npm packages: Prettier, esbuild and the browser libraries in vendor/. A bump of a
# vendored library fails bin/vendor --check in CI until someone runs npm ci and bin/vendor on its branch and commits the
# files; bootstrap also needs the bootstrap gem bumped to the same version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  # The workflows pin each action to a commit, with its version in a comment; this moves both to new releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
